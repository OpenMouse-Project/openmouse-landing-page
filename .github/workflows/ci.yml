name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Test
        run: npm test

      - name: Audit
        run: npm audit --audit-level=high

      - name: Approved runtime dependencies
        run: |
          node <<'NODE'
          const { dependencies = {} } = require("./package.json");
          const approved = {
            "@openmouse/protocol": "semver",
            "preact": "^10.29.8",
          };

          const names = Object.keys(dependencies);
          const expected = Object.keys(approved);
          const protocolOk = typeof dependencies["@openmouse/protocol"] === "string"
            && /^\d+\.\d+\.\d+(-[\w.]+)?$/.test(dependencies["@openmouse/protocol"]);

          if (JSON.stringify(names.sort()) !== JSON.stringify(expected.sort())
            || dependencies["preact"] !== approved["preact"]
            || !protocolOk) {
            console.error("Runtime dependencies differ from the maintainer-approved list.");
            console.error("Expected:", approved);
            console.error("Received:", dependencies);
            process.exit(1);
          }
          NODE
