<!-- Blog View Transitions, injected into every blog*.html head by
     build/blog-prerender.ts. It is inline so it applies before any script
     or stylesheet loads: the opt-in has to exist when the next page first
     renders, and the dark background stops a white flash meanwhile. -->
<style>
  @view-transition { navigation: auto; }
  html, body { background: #09090b; }
</style>
<!-- Prerender a blog page while its link is hovered (Chrome), so opening it
     is instant. -->
<script type="speculationrules">
  { "prerender": [{ "where": { "href_matches": "/blog*" }, "eagerness": "moderate" }] }
</script>
<script>
  // Posts name their headline and hero image post-title / post-image in
  // blog.css. On the index, the same names go on the title and cover of
  // the card being opened (or returned from), so those morph between the
  // two pages. Only one card carries them at a time, as the names must be
  // unique.
  (function () {
    var KEY = "openmouse:blog-last-post";
    var SLUG = /\/blog-([^/.?#]+)(?:\.html)?(?:[?#]|$)/;
    var onPost = SLUG.exec(location.pathname);
    if (onPost) {
      // Remember which post we're leaving, so the index can morph it back.
      addEventListener("pageswap", function () {
        try { sessionStorage.setItem(KEY, onPost[1]); } catch (e) {}
      });
      return;
    }
    function name(slug, on) {
      var card = slug && document.querySelector('[data-post="' + slug + '"]');
      if (!card) return;
      var parts = card.querySelectorAll("[data-vt]");
      for (var i = 0; i < parts.length; i++) {
        parts[i].style.viewTransitionName = on ? "post-" + parts[i].getAttribute("data-vt") : "";
      }
    }
    var clicked = null;
    document.addEventListener("click", function (e) {
      var link = e.target.closest && e.target.closest("a[href]");
      var match = link && SLUG.exec(link.getAttribute("href"));
      clicked = match ? match[1] : null;
    }, true);
    addEventListener("pageswap", function (e) {
      if (e.viewTransition) name(clicked, true);
    });
    addEventListener("pagereveal", function (e) {
      if (!e.viewTransition) return;
      var slug = null;
      try { slug = sessionStorage.getItem(KEY); } catch (err) {}
      name(slug, true);
      e.viewTransition.finished.then(function () { name(slug, false); });
    });
  })();
</script>
